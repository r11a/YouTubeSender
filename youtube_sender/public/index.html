<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827"><meta name="description" content="ניהול חכם של הפצת סרטוני YouTube">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="brand-mark.svg"><link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css"><title>YouTubeSender</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-nav="dashboard" aria-label="דף הבית"><img src="brand-mark.svg" alt=""><span><strong>YouTubeSender</strong><small>Content Flow</small></span></button>
      <nav id="nav">
        <button data-nav="dashboard" class="active"><span>⌂</span>סקירה</button>
        <button data-nav="videos"><span>▶</span>סרטונים <b id="nav-video-count"></b></button>
        <button data-nav="campaigns"><span>✦</span>הפצות</button>
        <button data-nav="contacts"><span>♙</span>אנשי קשר</button>
        <button data-nav="archive"><span>▣</span>ארכיון</button>
        <button data-nav="channels"><span>◉</span>ערוצים</button>
        <button data-nav="settings"><span>⚙</span>הגדרות</button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span>המערכת פעילה</span><small>v0.1.1</small></div>
    </aside>
    <main>
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="תפריט">☰</button>
        <div><p id="eyebrow">מרכז ההפצה שלך</p><h1 id="page-title">בוקר טוב 👋</h1></div>
        <div class="top-actions"><button class="icon-btn" id="install-app" hidden title="התקנת האפליקציה">⇩</button><button class="icon-btn notification-button" id="notifications-button" title="התראות">♢<i id="notification-count"></i></button><button class="primary compact" data-action="new-campaign">＋ הפצה חדשה</button></div>
      </header>
      <section id="app" aria-live="polite"><div class="loading"><span></span><p>מכינים את סביבת העבודה…</p></div></section>
    </main>
  </div>
  <div id="toast" role="status"></div><div id="modal-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
