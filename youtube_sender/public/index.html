  <link rel="stylesheet" href="styles.css?v=0.2.2"><link rel="stylesheet" href="theme-granite.css?v=0.2.2"><title>YouTubeSender</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-nav="dashboard" aria-label="דף הבית"><img src="icon-192.png?v=0.2.2" alt="לוגו YouTubeSender"><span><strong>YouTubeSender</strong><small>Content Flow</small></span></button>

      <section id="app" aria-live="polite"><div class="loading"><span></span><p>מכינים את סביבת העבודה…</p></div></section>
    </main>
  </div>
  <div id="toast" role="status"></div><div id="modal-root"></div>
  <script type="module" src="app.js?v=0.2.2"></script>
